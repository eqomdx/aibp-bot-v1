[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-agent"
version = "0.1.0"
description = "Phase 1 of a project-management meeting agent: transcript -> summary via Azure OpenAI."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.66",
    "python-dotenv>=1.0",
    "fastapi>=0.141",
    "uvicorn>=0.53",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
